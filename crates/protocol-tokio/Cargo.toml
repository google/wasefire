[package]
name = "wasefire-protocol-tokio"
version = "0.1.3-git"
edition = "2024"
description = "Wasefire protocol using std::io::Read and Write"
repository = "https://github.com/google/wasefire"
license = "Apache-2.0"
keywords = ["framework"]
categories = []
include = ["/LICENSE", "/src/"]
publish = true

[package.metadata.docs.rs]
features = ["device"]

[dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
wasefire-error = { path = "../error", version = "0.1.5-git", optional = true }
wasefire-logger = { path = "../logger", version = "0.2.2-git", optional = true }
wasefire-one-of = { path = "../one-of", version = "0.1.3-git" }

[dependencies.tokio]
version = "1.53.1"
default-features = false
features = ["io-util", "macros", "net", "rt", "sync"]

[dependencies.wasefire-board-api]
path = "../board"
version = "0.10.1-git"
features = ["std"]
optional = true

[dependencies.wasefire-protocol]
path = "../protocol"
version = "0.4.1-git"
features = ["host"]
optional = true

[features]
log = ["wasefire-board-api?/log", "wasefire-logger?/log"]

# Exactly one of host or device must be selected.
device = ["dep:wasefire-board-api", "dep:wasefire-error", "dep:wasefire-logger"]
host = ["dep:wasefire-protocol"]

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
rust.unreachable_pub = "warn"
rust.unused_crate_dependencies = "warn"
