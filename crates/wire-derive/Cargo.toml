[package]
name = "wasefire-wire-derive"
version = "0.1.4-git"
edition = "2024"
description = "Wasefire wire format derive macros"
repository = "https://github.com/google/wasefire"
license = "Apache-2.0"
keywords = ["embedded", "framework", "no-std"]
categories = ["embedded", "no-std"]
include = ["/LICENSE", "/src/"]
publish = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = { version = "1.0.107", default-features = false }
quote = { version = "1.0.47", default-features = false }

[dependencies.syn]
version = "3.0.4"
default-features = false
features = [
  "clone-impls",
  "derive",
  "extra-traits",
  "full",
  "parsing",
  "printing",
  "proc-macro",
  "visit-mut",
]

[dev-dependencies]
prettyplease = "0.3.0"
similar-asserts = "2.0.0"

[features]
_dev = []
schema = []

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
rust.unreachable_pub = "warn"
rust.unused_crate_dependencies = "warn"
