[package]
name = "wasefire-wire"
version = "0.1.4-git"
edition = "2024"
description = "Wasefire wire format"
repository = "https://github.com/google/wasefire"
license = "Apache-2.0"
keywords = ["embedded", "framework", "no-std"]
categories = ["embedded", "no-std"]
include = ["/LICENSE", "/src/"]
publish = true

[package.metadata.docs.rs]
all-features = true

[dependencies]
wasefire-common = { path = "../common", version = "0.1.2-git" }
wasefire-error = { path = "../error", version = "0.1.5-git" }
wasefire-wire-derive = { path = "../wire-derive", version = "0.1.4-git" }

[features]
schema = ["std", "wasefire-wire-derive/schema"]
std = []

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
rust.unreachable_pub = "warn"
rust.unused_crate_dependencies = "warn"
rust.unused_features = "allow"
