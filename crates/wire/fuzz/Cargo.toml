[package]
name = "fuzz"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "correct"
path = "fuzz_targets/correct.rs"

[dependencies]
libfuzzer-sys = "0.4"
wasefire-error.path = "../../error"
wasefire-wire = { path = "..", features = ["schema"] }

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
