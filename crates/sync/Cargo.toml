[package]
name = "wasefire-sync"
version = "0.1.4-git"
edition = "2024"
description = "Portable non-blocking mutex"
repository = "https://github.com/google/wasefire"
license = "Apache-2.0"
keywords = ["framework", "mutex", "no-std"]
categories = ["concurrency", "no-std"]
include = ["/LICENSE", "/src/"]
publish = true

[dependencies]
portable-atomic = { version = "1.13.1", default-features = false }

[dependencies.spin]
version = "0.12.0"
default-features = false
features = ["lazy", "once", "portable_atomic", "spin_mutex"]

[features]
unsafe-assume-single-core = ["portable-atomic/unsafe-assume-single-core"]

[lints]
clippy.mod-module-files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit-arg = "allow"
rust.unreachable-pub = "warn"
rust.unused-crate-dependencies = "warn"
