[package]
name = "wasefire-stub"
version = "0.1.8-git"
edition = "2024"
description = "Stubs for the Wasefire applet API"
repository = "https://github.com/google/wasefire"
license = "Apache-2.0"
keywords = ["framework"]
categories = []
include = ["/LICENSE", "/src/"]
publish = true

[dependencies]
crypto-common = { version = "0.2.2", default-features = false }
digest = { version = "0.11.3", default-features = false, features = ["mac"] }
ecdsa = { version = "0.17.0", default-features = false }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["rand_core"] }
elliptic-curve = { version = "0.14.1", default-features = false }
hkdf = { version = "0.13.0", default-features = false }
hmac = { version = "0.13.0", default-features = false }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
rand = { version = "0.10.2", default-features = false, features = ["thread_rng"] }
sha2 = { version = "0.11.0", default-features = false }
signature = { version = "3.0.0", default-features = false }
wasefire-error = { path = "../error", version = "0.1.5-git" }
wasefire-logger = { path = "../logger", version = "0.2.2-git" }
zeroize = { version = "1.9.0", default-features = false }

[dependencies.wasefire-applet-api]
path = "../api"
version = "0.9.1-git"
features = ["full-api", "native", "wasm"]

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
rust.unreachable_pub = "warn"
rust.unused_crate_dependencies = "warn"
