[package]
name = "wasefire-interpreter"
version = "0.5.1-git"
edition = "2024"
description = "Wasefire WebAssembly interpreter"
repository = "https://github.com/google/wasefire"
license = "Apache-2.0"
keywords = ["embedded", "framework", "no-std", "wasm"]
categories = ["embedded", "no-std", "wasm"]
include = ["/LICENSE", "/src/"]
publish = true

[dependencies]
derive-where = { version = "1.6.1", default-features = false, features = ["nightly"] }
libm = { version = "0.2.16", default-features = false, optional = true }
num_enum = { version = "0.7.6", default-features = false }
paste = { version = "1.0.15", default-features = false }
wasefire-common = { path = "../common", version = "0.1.2-git" }
wasefire-error = { path = "../error", version = "0.1.5-git" }

[dev-dependencies]
lazy_static = "1.5.0"
wast = "251.0.0"

[features]
# Enable debugging features (only works for targets with std).
debug = []
# Enable support for specific types.
float-types = ["dep:libm"]
# Use safe operations when time-of-use and time-of-check differ.
toctou = []
vector-types = []

[lints]
clippy.mod-module-files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit-arg = "allow"
rust.unused-crate-dependencies = "warn"
