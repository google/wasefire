[package]
name = "wasefire-protocol-usb"
version = "0.3.2-git"
edition = "2024"
description = "Wasefire USB protocol between platform and host"
repository = "https://github.com/google/wasefire"
license = "Apache-2.0"
keywords = ["embedded", "framework", "no-std"]
categories = ["embedded", "no-std"]
include = ["/LICENSE", "/src/"]
publish = true

[package.metadata.docs.rs]
features = ["device"]

[dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"], optional = true }
defmt = { version = "1.1.1", default-features = false, optional = true }
rusb = { version = "0.9.4", default-features = false, optional = true }
usb-device = { version = "0.3.2", default-features = false, optional = true }
wasefire-error = { path = "../error", version = "0.1.5-git", optional = true }
wasefire-logger = { path = "../logger", version = "0.2.2-git" }
wasefire-one-of = { path = "../one-of", version = "0.1.3-git" }

[dependencies.wasefire-board-api]
path = "../board"
version = "0.11.0-git"
optional = true

[dependencies.wasefire-protocol]
path = "../protocol"
version = "0.4.1-git"
features = ["host"]
optional = true

[features]
defmt = ["dep:defmt", "wasefire-board-api?/defmt", "wasefire-error?/defmt", "wasefire-logger/defmt"]
log = ["wasefire-board-api?/log", "wasefire-logger/log"]
std = ["wasefire-board-api?/std"]

# At most one of host or device must be selected.
device = ["dep:usb-device", "dep:wasefire-board-api", "dep:wasefire-error"]
host = ["dep:anyhow", "dep:rusb", "dep:wasefire-protocol", "std"]

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
rust.unreachable_pub = "warn"
rust.unused_crate_dependencies = "warn"
