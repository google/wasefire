[package]
name = "fuzz"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[[bin]]
name = "lib"
path = "fuzz_targets/lib.rs"

[dependencies]
libfuzzer-sys = "0.4.13"
wasefire-slice-cell = { path = ".." }

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
