[package]
name = "web-client"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
gloo-utils = "0.3.0"
log = "0.4.33"
serde_json = "1.0.151"
wasm-bindgen = "0.2.126"
wasm-logger = "0.2.0"
web-common = { path = "../web-common" }
web-sys = "0.3.103"
yew = { version = "0.23", features = ["csr"] }
yew-hooks = "0.6.4"

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
rust.unused_crate_dependencies = "warn"
