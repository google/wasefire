[package]
name = "web-client"
version = "0.1.0"
license = "Apache-2.0"
publish = false
edition = "2024"

[dependencies]
gloo-utils = "0.3.0"
log = "0.4.29"
serde_json = "1.0.149"
wasm-bindgen = "0.2.120"
wasm-logger = "0.2.0"
web-common = { path = "../web-common" }
web-sys = "0.3.97"
yew = { version = "0.23", features = ["csr"] }
yew-hooks = "0.6.4"

[lints]
clippy.mod-module-files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit-arg = "allow"
rust.unused-crate-dependencies = "warn"
