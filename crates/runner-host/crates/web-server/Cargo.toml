[package]
name = "web-server"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
anyhow = "1.0.104"
futures-util = "0.3.33"
log = { version = "0.4.33", optional = true }
opener = "0.8.5"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full", "rt-multi-thread", "sync"] }
warp = { version = "0.4.3", features = ["server", "websocket"] }
wasefire-logger = { path = "../../../logger" }
wasefire-protocol = { path = "../../../protocol" }
web-common = { path = "../web-common" }

[features]
log = ["dep:log", "wasefire-logger/log"]

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
rust.unused_crate_dependencies = "warn"
