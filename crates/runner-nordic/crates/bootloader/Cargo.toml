[package]
name = "bootloader"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.6"
embedded-storage = "0.3.1"
header = { path = "../header" }
nrf52840-hal = "0.19.0"
panic-abort = "0.3.2"
wasefire-common = { path = "../../../common" }
wasefire-one-of = { path = "../../../one-of" }

[features]
# Enabled by xtask.
single-sided = []

# Exactly one is enabled by xtask.
board-devkit = ["header/board-devkit"]
board-dongle = ["header/board-dongle"]

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
rust.unused_crate_dependencies = "warn"
