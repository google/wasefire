[package]
name = "bootloader"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
cortex-m = "0.7.10"
cortex-m-rt = "0.7.7"
embedded-storage = "0.3.2"
header = { path = "../header" }
nrf52840-hal = "0.19.0"
wasefire-common = { path = "../../../common" }
wasefire-one-of = { path = "../../../one-of" }

# TODO(https://github.com/japaric/panic-abort/pull/10): Update when merged.
[dependencies.panic-abort]
git = "https://github.com/ia0/panic-abort.git"
rev = "86fe2758d1fabc677136159629c19cad3a6fe205"
version = "0.3.2"

[features]
# Enabled by xtask.
single-sided = []

# Exactly one is enabled by xtask.
board-devkit = ["header/board-devkit"]
board-dongle = ["header/board-dongle"]

[profile.release]
lto = true
panic = "abort"
codegen-units = 1

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
rust.unused_crate_dependencies = "warn"
