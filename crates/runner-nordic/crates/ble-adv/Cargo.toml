[package]
name = "ble-adv"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
bytemuck = { version = "1.25.2", default-features = false, features = ["derive"] }
defmt = { version = "1.1.1", default-features = false, optional = true }

[features]
defmt = ["dep:defmt"]

[lints]
clippy.mod_module_files = "warn"
clippy.uninlined_format_args = "allow"
clippy.unit_arg = "allow"
rust.unused_crate_dependencies = "warn"
