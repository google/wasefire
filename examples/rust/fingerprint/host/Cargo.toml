[package]
name = "host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
common = { path = "../common" }
data-encoding = "2.11.1"
signal-hook = "0.4.4"
tokio = { version = "1.53.1", features = ["full"] }
wasefire-cli-tools = { path = "../../../../crates/cli-tools", features = ["action"] }
wasefire-error = { path = "../../../../crates/error" }
wasefire-protocol = { path = "../../../../crates/protocol", features = ["host"] }
wasefire-wire = { path = "../../../../crates/wire" }

[lints]
clippy.mod_module_files = "warn"
clippy.unit_arg = "allow"
rust.unreachable_pub = "warn"
rust.unused_crate_dependencies = "warn"
