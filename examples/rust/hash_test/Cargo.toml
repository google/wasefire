[package]
name = "hash_test"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
digest = { version = "0.11.3", default-features = false, optional = true }
wasefire = { path = "../../../crates/prelude" }
wasefire-stub = { path = "../../../crates/stub", optional = true }

[features]
rust-crypto = ["dep:digest", "wasefire/rust-crypto"]
test = ["dep:wasefire-stub", "wasefire/test"]

[lints]
clippy.mod_module_files = "warn"
clippy.unit_arg = "allow"
rust.unreachable_pub = "warn"
rust.unused_crate_dependencies = "warn"
